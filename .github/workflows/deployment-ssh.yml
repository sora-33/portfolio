name: Deploy Portfolio

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Debug SSH_HOSTNAME presence
        run: |
          if [ -z "${{ secrets.SSH_HOSTNAME }}" ]; then
            echo "ERROR: secrets.SSH_HOSTNAME is EMPTY (name mismatch or env secret not attached)"
            exit 1
          fi
          echo "SSH_HOSTNAME is set"

      - name: Debug SSH_USERNAME presence
        run: |
          if [ -z "${{ secrets.SSH_USERNAME }}" ]; then
            echo "ERROR: secrets.SSH_USERNAME is EMPTY (name mismatch or env secret not attached)"
            exit 1
          fi
          echo "SSH_USERNAME is set"

      - name: Debug SSH_PRIVATE_KEY presence
        run: |
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "ERROR: secrets.SSH_PRIVATE_KEY is EMPTY (name mismatch or env secret not attached)"
            exit 1
          fi
          echo "SSH_PRIVATE_KEY is set"


      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          cat > ~/.ssh/id_ed25519 << 'EOF'
          ${{ secrets.SSH_PRIVATE_KEY }}
          EOF
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 10022 ${{ secrets.SSH_HOSTNAME }} >> ~/.ssh/known_hosts

      - name: Deploy with rsync
        run: |
          rsync -avz --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='.gitignore' \
            -e 'ssh -p 10022 -i ~/.ssh/id_ed25519' \
            "$GITHUB_WORKSPACE/" \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOSTNAME }}:/home/${{ secrets.SSH_USERNAME }}/jibiki.tech/public_html
