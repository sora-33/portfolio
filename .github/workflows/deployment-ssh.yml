name: Deploy Portfolio

on:
  push:
    branches:
      - main # デプロイ対象のブランチ

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOSTNAME }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 10022
          script: |
            cd /home/${{ secrets.SSH_USERNAME }}/jibiki.tech/public_html

            rrsync -avz \
            -e "ssh -o StrictHostKeyChecking=no -p 10022" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='.gitignore' \
            "$GITHUB_WORKSPACE"/ \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOSTNAME }}:/home/${{ secrets.SSH_USERNAME }}/jibiki.tech/public_html
